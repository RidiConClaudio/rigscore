<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="RigScore: scan your PC, see how games will run, and get software tweaks and hardware upgrade advice with prices.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 28 28'%3E%3Crect x='1.5' y='1.5' width='25' height='25' rx='6' fill='%23161B22' stroke='%23FF7B3A' stroke-width='2'/%3E%3Cpath d='M6 18 L10 12 L14 15 L18 8 L22 11' fill='none' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px;font-family:system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>RigScore</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: banco prova strumentale. Barra in alto con schede, pannelli a griglia, letture numeriche in monospace. */
:root{
  --bg:#ECEEF1; --surface:#FFFFFF; --sunken:#F4F5F7; --ink:#141922; --muted:#5A6473; --line:#D6DBE2;
  --accent:#D2561A; --accent-soft:#F8E3D7; --accent-ink:#FFFFFF;
  --good:#1D7F49; --good-soft:#DDF1E5; --warn:#A86A0C; --warn-soft:#F7EBD3; --bad:#BF3328; --bad-soft:#F8DEDB; --info:#2961A6; --info-soft:#DCE8F6;
  --f-display:"Archivo", "Segoe UI", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Consolas, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E1217; --surface:#161B22; --sunken:#11161C; --ink:#E5E9EF; --muted:#93A0B1; --line:#29313C;
    --accent:#FF7B3A; --accent-soft:#3A2418; --accent-ink:#1A0D05;
    --good:#45C47E; --good-soft:#15301F; --warn:#E3AA4C; --warn-soft:#352812; --bad:#F2695B; --bad-soft:#3A1A17; --info:#6FA8EC; --info-soft:#16263A;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1217; --surface:#161B22; --sunken:#11161C; --ink:#E5E9EF; --muted:#93A0B1; --line:#29313C;
  --accent:#FF7B3A; --accent-soft:#3A2418; --accent-ink:#1A0D05;
  --good:#45C47E; --good-soft:#15301F; --warn:#E3AA4C; --warn-soft:#352812; --bad:#F2695B; --bad-soft:#3A1A17; --info:#6FA8EC; --info-soft:#16263A;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar{display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding-block:12px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:-.01em}
.brand svg{flex:none}
.brand small{font-family:var(--f-mono);font-weight:400;font-size:11px;color:var(--muted);letter-spacing:.04em}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
nav.tabs button{font:500 14px var(--f-body);color:var(--muted);background:none;border:1px solid transparent;border-radius:8px;padding:7px 12px;cursor:pointer}
nav.tabs button:hover{color:var(--ink);background:var(--sunken)}
nav.tabs button[aria-selected="true"]{color:var(--ink);background:var(--sunken);border-color:var(--line)}
.prefs{display:flex;gap:6px}
.prefs select{width:auto;padding:5px 8px;font-size:13px}
nav.tabs button .n{font-family:var(--f-mono);font-size:11px;color:var(--accent);margin-left:6px}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{padding-block:24px 64px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h2{font-size:22px;font-weight:700}
h3{font-size:16px;font-weight:700}
p{margin:0}
a{color:var(--info)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px}
.sec-head{display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.sec-head p{max-width:70ch}
[role="tabpanel"]{display:flex;flex-direction:column;gap:20px}

/* chips */
.chip{display:inline-flex;align-items:center;gap:6px;font:500 12px var(--f-body);padding:2px 9px;border-radius:999px;white-space:nowrap;border:1px solid transparent}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.info{background:var(--info-soft);color:var(--info)}
.chip.neutral{background:var(--sunken);color:var(--muted);border-color:var(--line)}
.chip.accent{background:var(--accent-soft);color:var(--accent)}

/* buttons & inputs */
.btn{font:600 14px var(--f-body);border-radius:8px;padding:9px 16px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.sm{padding:5px 10px;font-size:13px}
input[type="text"],input[type="number"],input[type="search"],select,textarea{font:14px var(--f-body);color:var(--ink);background:var(--sunken);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
textarea{font-family:var(--f-mono);font-size:12px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted);font-weight:500}

/* banner */
.banner{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:14px 18px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface)}
.banner.warn{border-color:color-mix(in srgb,var(--warn) 45%,var(--line));background:var(--warn-soft)}
.banner p{flex:1 1 320px}

/* overview */
.hero{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:16px}
@media (max-width:820px){.hero{grid-template-columns:1fr}}
.gauge{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.gauge svg{width:190px;height:190px;max-width:100%}
.gauge .tier{font-family:var(--f-display);font-weight:800;font-size:20px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;width:100%}
.fact{background:var(--sunken);border:1px solid var(--line);border-radius:8px;padding:8px 10px;text-align:left}
.fact b{display:block;font-family:var(--f-mono);font-size:18px;font-weight:500}
.comp{display:grid;grid-template-columns:130px minmax(0,1fr) auto;gap:6px 16px;padding:14px 0;border-top:1px solid var(--line);align-items:start}
.comp:first-child{border-top:0;padding-top:0}
.comp .k{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-top:3px}
.comp .v{font-weight:600;overflow-wrap:anywhere}
.comp .d{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.comp .s{justify-self:end}
@media (max-width:560px){.comp{grid-template-columns:1fr auto}.comp .k{grid-column:1/-1}}
.meter{height:6px;border-radius:3px;background:var(--sunken);border:1px solid var(--line);overflow:hidden;margin-top:6px;max-width:420px}
.meter i{display:block;height:100%;background:var(--accent);border-radius:3px}
.meter.good i{background:var(--good)} .meter.warn i{background:var(--warn)} .meter.bad i{background:var(--bad)}

.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:6px minmax(0,1fr);gap:14px;padding:14px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .bar{border-radius:3px;background:var(--line)}
.item.crit .bar{background:var(--bad)} .item.rec .bar{background:var(--warn)} .item.opt .bar{background:var(--info)} .item.ok .bar{background:var(--good)}
.item .body{display:flex;flex-direction:column;gap:6px;min-width:0}
.item .t{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.item .t h3{font-size:15px}
.item ul{margin:0;padding-left:18px}
.cmd{display:flex;gap:8px;align-items:stretch;max-width:100%}
.cmd code{flex:1;min-width:0;font-family:var(--f-mono);font-size:12.5px;background:var(--sunken);border:1px solid var(--line);border-radius:6px;padding:7px 10px;overflow-x:auto;white-space:pre}

/* games */
.gtools{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.gtools > *{flex:1 1 160px}
.gtools .seg{flex:0 0 auto}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--sunken)}
.seg button{font:500 13px var(--f-body);border:0;background:none;color:var(--muted);padding:8px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.games{display:flex;flex-direction:column}
.game{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) 120px;gap:6px 18px;padding:12px 0;border-top:1px solid var(--line);align-items:center}
.game:first-child{border-top:0}
.game .name{font-weight:600}
.game .req{font-size:12px;color:var(--muted)}
.game .pbar{display:flex;align-items:center;gap:10px}
.game .pbar .meter{flex:1;margin:0;height:8px}
.game .pct{font-family:var(--f-mono);font-size:15px;width:44px;text-align:right}
.game .fps{text-align:right;font-family:var(--f-mono);font-size:13px}
.game .fps b{font-size:16px;font-weight:500}
.game .why{font-size:12px;color:var(--muted)}
@media (max-width:700px){.game{grid-template-columns:1fr auto}.game .pbar{grid-column:1/-1;order:3}}

/* upgrades */
.offers{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:12px}
.offer{border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.offer.best{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.offer .price{font-family:var(--f-mono);font-size:22px;font-weight:500}
.offer .gain{font-family:var(--f-mono);font-size:13px}
.offer .links{font-size:12px;margin-top:auto;display:flex;gap:10px;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-family:var(--f-mono)}
.verdict{border-left:4px solid var(--accent);padding:4px 0 4px 16px}
.verdict p{max-width:75ch}

/* scan */
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:16px}
.step{display:flex;flex-direction:column;gap:10px}
.step .num{font-family:var(--f-mono);font-size:12px;color:var(--accent);font-weight:500}
kbd{font-family:var(--f-mono);font-size:12px;background:var(--sunken);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px}
.note{font-size:12.5px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:14px;z-index:20}
.empty{padding:20px;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.meter i{transition:width .5s ease}}
</style>

<header class="top">
  <div class="wrap topbar">
    <div class="brand">
      <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><rect x="1.5" y="1.5" width="25" height="25" rx="6" fill="none" stroke="var(--accent)" stroke-width="2"/><path d="M6 18 L10 12 L14 15 L18 8 L22 11" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="22" cy="11" r="2" fill="var(--accent)"/></svg>
      <span>RigScore <small id="srcLabel">—</small></span>
    </div>
    <nav class="tabs" role="tablist" aria-label="Sezioni">
      <button role="tab" id="t-over" aria-controls="p-over" aria-selected="true">Panoramica</button>
      <button role="tab" id="t-games" aria-controls="p-games" aria-selected="false">Giochi <span class="n" id="nGames"></span></button>
      <button role="tab" id="t-soft" aria-controls="p-soft" aria-selected="false">Ottimizza <span class="n" id="nSoft"></span></button>
      <button role="tab" id="t-upg" aria-controls="p-upg" aria-selected="false">Upgrade</button>
      <button role="tab" id="t-scan" aria-controls="p-scan" aria-selected="false">Scansione</button>
    </nav>
    <div class="prefs"><select id="langSel" aria-label="Lingua"><option value="it">Italiano</option><option value="en">English</option></select><select id="regSel" aria-label="Paese"></select></div>
  </div>
</header>

<div class="wrap" id="waitBar" hidden><div class="banner warn" style="margin-top:16px"><p><b>Scansione in corso in PowerShell.</b> Se il browser chiede “Aprire RigScore?”, conferma. Alla fine RigScore si aggiorna con i risultati; se non succede, premi <kbd>Ctrl</kbd>+<kbd>V</kbd> qui.</p></div></div>
<main class="wrap">
  <section role="tabpanel" id="p-over" aria-labelledby="t-over"></section>
  <section role="tabpanel" id="p-games" aria-labelledby="t-games" hidden></section>
  <section role="tabpanel" id="p-soft" aria-labelledby="t-soft" hidden></section>
  <section role="tabpanel" id="p-upg" aria-labelledby="t-upg" hidden></section>
  <section role="tabpanel" id="p-scan" aria-labelledby="t-scan" hidden></section>
</main>

<script type="text/plain" id="ps-src">& {
$ErrorActionPreference = 'SilentlyContinue'
$it = (Get-Culture).TwoLetterISOLanguageName -eq 'it'
Write-Host ''
Write-Host $(if ($it) { '  RigScore: lettura delle specifiche in corso (10-30 secondi)...' } else { '  RigScore: reading your PC specs (10-30 seconds)...' }) -ForegroundColor Cyan
function S($v) { if ($null -eq $v) { $null } else { ("$v" -replace "`0", '').Trim() } }
$o = [ordered]@{ v = 2; t = (Get-Date).ToString('s') }
$cs = Get-CimInstance Win32_ComputerSystem
$os = Get-CimInstance Win32_OperatingSystem
$cv = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion'
$enc = Get-CimInstance Win32_SystemEnclosure | Select-Object -First 1
$bat = Get-CimInstance Win32_Battery | Select-Object -First 1
$bb = Get-CimInstance Win32_BaseBoard | Select-Object -First 1
$bios = Get-CimInstance Win32_BIOS | Select-Object -First 1
$sb = (Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\SecureBoot\State').UEFISecureBootEnabled
$batHealth = $null
try {
  $d = (Get-CimInstance -Namespace root\wmi -ClassName BatteryStaticData -ErrorAction Stop | Select-Object -First 1).DesignedCapacity
  $f = (Get-CimInstance -Namespace root\wmi -ClassName BatteryFullChargedCapacity -ErrorAction Stop | Select-Object -First 1).FullChargedCapacity
  if ($d -gt 0 -and $f -gt 0) { $batHealth = [math]::Round(100 * $f / $d) }
} catch {}
$o.sys = [ordered]@{
  maker = S $cs.Manufacturer; model = S $cs.Model; chassis = @($enc.ChassisTypes); pcType = $cs.PCSystemType
  battery = [bool]$bat; batteryHealth = $batHealth
  board = S "$($bb.Manufacturer) $($bb.Product)"; bios = S "$($bios.SMBIOSBIOSVersion)"; biosDate = $(if ($bios.ReleaseDate) { $bios.ReleaseDate.ToString('yyyy-MM-dd') })
  uefi = ($null -ne $sb); secureBoot = ($sb -eq 1)
}
$o.os = [ordered]@{
  name = S $os.Caption; ver = S $os.Version; build = [int]$os.BuildNumber; ubr = $cv.UBR; disp = S $cv.DisplayVersion
  arch = S $os.OSArchitecture; installed = $(if ($os.InstallDate) { $os.InstallDate.ToString('yyyy-MM-dd') })
  uptimeH = [math]::Round(((Get-Date) - $os.LastBootUpTime).TotalHours, 1)
  ramFreeMB = [math]::Round($os.FreePhysicalMemory / 1024); procs = @(Get-Process).Count
}
$cpu = Get-CimInstance Win32_Processor | Select-Object -First 1
$o.cpu = [ordered]@{ name = S $cpu.Name; cores = $cpu.NumberOfCores; threads = $cpu.NumberOfLogicalProcessors; mhz = $cpu.MaxClockSpeed; socket = S $cpu.SocketDesignation; l3KB = $cpu.L3CacheSize; virt = $cpu.VirtualizationFirmwareEnabled }
$reg = Get-ChildItem 'HKLM:\SYSTEM\ControlSet001\Control\Class\{4d36e968-e325-11ce-bfc1-08002be10318}' | ForEach-Object { Get-ItemProperty $_.PSPath } | Where-Object { $_.DriverDesc }
$o.gpu = @(Get-CimInstance Win32_VideoController | Where-Object { $_.Name -notmatch 'Remote|Virtual|Basic Display|Mirage|Parsec|Indirect' } | ForEach-Object {
  $n = S $_.Name; $r = $reg | Where-Object { $_.DriverDesc -eq $n } | Select-Object -First 1
  $vram = $r.'HardwareInformation.qwMemorySize'
  if (-not $vram) { $m = $r.'HardwareInformation.MemorySize'; if ($m -is [byte[]]) { $vram = [BitConverter]::ToUInt32($m, 0) } elseif ($m) { $vram = $m } }
  if (-not $vram) { $vram = $_.AdapterRAM }
  [ordered]@{ name = $n; vramMB = [math]::Round([double]$vram / 1MB); driver = S $_.DriverVersion; driverDate = $(if ($_.DriverDate) { $_.DriverDate.ToString('yyyy-MM-dd') }); w = $_.CurrentHorizontalResolution; h = $_.CurrentVerticalResolution; hz = $_.CurrentRefreshRate; maxHz = $_.MaxRefreshRate }
})
$o.mon = @(Get-CimInstance -Namespace root\wmi -ClassName WmiMonitorID | ForEach-Object {
  [ordered]@{ n = S (($_.UserFriendlyName | Where-Object { $_ -ne 0 } | ForEach-Object { [char]$_ }) -join ''); mf = S (($_.ManufacturerName | Where-Object { $_ -ne 0 } | ForEach-Object { [char]$_ }) -join ''); year = $_.YearOfManufacture }
})
$arr = Get-CimInstance Win32_PhysicalMemoryArray | Where-Object { $_.Use -eq 3 }
$sticks = @(Get-CimInstance Win32_PhysicalMemory | Where-Object { $_.Capacity -gt 0 } | ForEach-Object { [ordered]@{ gb = [math]::Round($_.Capacity / 1GB); speed = $_.Speed; cfg = $_.ConfiguredClockSpeed; type = $_.SMBIOSMemoryType; mtype = $_.MemoryType; ff = $_.FormFactor; maker = S $_.Manufacturer; part = S $_.PartNumber; slot = S $_.DeviceLocator; volt = $_.ConfiguredVoltage } })
$o.ram = [ordered]@{
  slots = ($arr | Measure-Object MemoryDevices -Sum).Sum; maxGB = [math]::Round((($arr | Measure-Object MaxCapacityEx -Sum).Sum) / 1MB)
  totalGB = [math]::Round($cs.TotalPhysicalMemory / 1GB, 1); sumGB = ($sticks | ForEach-Object { $_.gb } | Measure-Object -Sum).Sum
  sticks = $sticks
}
$msft = @(Get-CimInstance -Namespace root\Microsoft\Windows\Storage -ClassName MSFT_PhysicalDisk)
$pds = @(Get-PhysicalDisk)
if ($pds.Count) {
  $o.disks = @($pds | ForEach-Object {
    $num = "$($_.DeviceId)"; $mf = $msft | Where-Object { "$($_.DeviceId)" -eq $num } | Select-Object -First 1
    $media = S $_.MediaType; $bus = S $_.BusType; $nm = S $_.FriendlyName; $rpm = $mf.SpindleSpeed
    if ($bus -in 'RAID', 'SCSI', 'Unknown' -and $nm -match 'NVMe|PCIe') { $bus = 'NVMe' }
    if ($media -notin 'SSD', 'HDD') {
      if ($bus -eq 'NVMe' -or $nm -match 'NVMe|SSD|Solid State|M\.2') { $media = 'SSD' }
      elseif ($rpm -eq 0) { $media = 'SSD' }
      elseif ($rpm -gt 0 -and $rpm -lt 100000) { $media = 'HDD' }
      elseif ($bus -eq 'USB') { $media = 'USB' }
    }
    $letters = @(Get-Partition -DiskNumber ([int]$num) | Where-Object { $_.DriveLetter } | ForEach-Object { "$($_.DriveLetter)" })
    $wear = $null; $temp = $null
    try { $rc = $_ | Get-StorageReliabilityCounter -ErrorAction Stop; $wear = $rc.Wear; $temp = $rc.Temperature } catch {}
    [ordered]@{ name = $nm; media = $media; bus = $bus; gb = [math]::Round($_.Size / 1GB); health = S $_.HealthStatus; letters = $letters; wear = $wear; temp = $temp; rpm = $(if ($rpm -lt 100000) { $rpm }) }
  })
} else {
  $o.disks = @(Get-CimInstance Win32_DiskDrive | ForEach-Object {
    $dd = $_
    $letters = @(Get-CimAssociatedInstance -InputObject $dd -ResultClassName Win32_DiskPartition | ForEach-Object { Get-CimAssociatedInstance -InputObject $_ -ResultClassName Win32_LogicalDisk } | ForEach-Object { "$($_.DeviceID)".TrimEnd(':') })

function norm(s){
  return String(s||"").toLowerCase()
    .replace(/\((r|tm|c)\)|®|™/g," ")
    .replace(/\(0x[0-9a-f]+\)/g," ")
    .replace(/\b(nvidia|geforce|amd|ati|intel|corporation|gpu|series)\b/g," ")
    .replace(/\biris\s+(plus\s+|pro\s+)?graphics\s+(\d)/g,"iris $1$2")
    .replace(/\brx\s+vega\s+(\d)/g,"vega $1")
    .replace(/[^a-z0-9+ ]/g," ")
    .replace(/([a-z])(\d)/g,"$1 $2")
    .replace(/\s+/g," ").trim();
}

GPUS.sort((a,b)=>b.key.length-a.key.length);
const escRe = s=>s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
GPUS.forEach(g=>g.re=new RegExp("(^| )"+escRe(g.key)+"( |$)"));

function findGPU(name){
  const n=norm(name); if(!n) return null;
  if(n==="graphics"||n==="graphics family") return {n:"Intel Graphics",key:n,s:1500,vram:0,rt:true,w:0,kind:"i"};
  const hit=GPUS.find(g=>g.re.test(n)); if(hit) return hit;
  const al=GPU_ALIAS.find(([k])=>n===k||n.startsWith(k+" ")); if(al) return GPUS.find(g=>g.n===al[1])||null;
  return null;
}

function refineIGPU(g, cpuName){

  const c=cpuName.toLowerCase(), ci=cpuInfo(cpuName); let s=g.s, n=g.n;
  if(/z1 extreme/.test(c)){s=2900;n="Radeon 780M (Ryzen Z1 Extreme)";}
  else if(/z2 extreme/.test(c)){s=3600;n="Radeon 890M (Ryzen Z2 Extreme)";}
  else if(/z2 go/.test(c)){s=2000;n="Radeon 680M (Ryzen Z2 Go)";}
  else if(/ryzen z1/.test(c)){s=1600;n="Radeon 740M (Ryzen Z1)";}
  else if(/ryzen z2/.test(c)){s=2500;}
  else if(ci.vendor==="amd"&&!ci.mobile&&ci.gen===8){s=/8700g/.test(c)?2800:/8600g/.test(c)?2400:1500;n="Radeon 700M (Ryzen 8000G)";}

  else if(ci.vendor==="amd"&&ci.mobile&&(ci.gen||0)>=7){s=1000;}
  return {...g,s,n};

const prefGet=k=>{ try{ return localStorage.getItem(k); }catch(e){ return null; } };
const prefSet=(k,v)=>{ try{ localStorage.setItem(k,v); }catch(e){} };
const NAVL=String(navigator.language||"en").toLowerCase();
let LANG=prefGet("rigscore.lang")||(NAVL.startsWith("it")?"it":"en");
let REGION=prefGet("rigscore.region")||({it:"IT",de:"DE",fr:"FR",es:"ES"}[NAVL.slice(0,2)]||(NAVL==="en"||NAVL.endsWith("-us")?"US":NAVL.endsWith("-gb")?"GB":"INT"));
if(!REGIONS[REGION]) REGION="INT";
const REG=()=>REGIONS[REGION];
const LOC=()=>LANG==="it"?"it-IT":(REG().loc.startsWith("en")?REG().loc:"en-GB");
const EN_SORTED=EN_PAIRS.slice().sort((a,b)=>b[0].length-a[0].length);
function trS(s){ if(LANG!=="en"||s==null) return s; let r=String(s); const k=r.trim(); if(EN_EXACT.has(k)) return r.replace(k,EN_EXACT.get(k)); for(const [a,b] of EN_SORTED){ if(r.includes(a)) r=r.split(a).join(b); } return r; }
const NO_TR="code,textarea,script,style";
function trDOM(root){
  if(LANG!=="en"||!root) return;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT); const list=[]; let t; while((t=w.nextNode())) list.push(t);
  if(root.nodeType===3) list.push(root);
  for(const x of list){ const p=x.parentElement; if(!p||p.closest(NO_TR)) continue; const v=trS(x.nodeValue); if(v!==x.nodeValue) x.nodeValue=v; }
  if(root.querySelectorAll){ const els=[...root.querySelectorAll("[placeholder],[aria-label]")]; if(root.hasAttribute&&(root.hasAttribute("placeholder")||root.hasAttribute("aria-label"))) els.push(root); els.forEach(el=>["placeholder","aria-label"].forEach(at=>{ if(el.hasAttribute(at)){ const v=trS(el.getAttribute(at)); if(v!==el.getAttribute(at)) el.setAttribute(at,v); } })); }
}
const MO=new MutationObserver(ms=>{ if(LANG!=="en") return; for(const m of ms) for(const nd of m.addedNodes){ if(nd.nodeType===1) trDOM(nd); else if(nd.nodeType===3&&nd.parentElement&&!nd.parentElement.closest(NO_TR)){ const v=trS(nd.nodeValue); if(v!==nd.nodeValue) nd.nodeValue=v; } } });
function initPrefs(){
  document.documentElement.lang=LANG;
  const ls=document.getElementById("langSel"), rs=document.getElementById("regSel");
  rs.innerHTML=Object.entries(REGIONS).map(([k,r])=>`<option value="${k}">${r.n}</option>`).join("");
  ls.value=LANG; rs.value=REGION;
  ls.addEventListener("change",()=>{ prefSet("rigscore.lang",ls.value); location.reload(); });
  rs.addEventListener("change",()=>{ REGION=rs.value; prefSet("rigscore.region",REGION); if(typeof recompute==="function"&&P) recompute(); });
  trDOM(document.body);
  MO.observe(document.body,{childList:true,subtree:true});
}

function parseRenderer(r){
  if(!r) return null;
  let s=r;
  if(/^ANGLE \(/.test(s)){ const inner=s.replace(/^ANGLE \(/,"").replace(/\)$/,""); const parts=inner.split(", "); s=parts.length>1?parts[1]:parts[0]; }
  return s.replace(/\s*\(0x[0-9a-f]+\).*/i,"").replace(/\s+(Direct3D|OpenGL|Vulkan|Metal|vs_|D3D).*/i,"").trim();
}
function measureHz(){ return new Promise(res=>{ let n=0,t0=0; const f=t=>{ if(!t0) t0=t; n++; if(t-t0<600) requestAnimationFrame(f); else { const hz=(n-1)/((t-t0)/1000); const std=[60,75,90,100,120,144,165,170,180,240,360]; const near=std.reduce((a,b)=>Math.abs(b-hz)<Math.abs(a-hz)?b:a); res(hz<50?null:Math.abs(near-hz)<8?near:Math.round(hz)); } }; requestAnimationFrame(f); setTimeout(()=>res(null),1500); }); }
/* Benchmark CPU single-thread. Taratura: Intel i7-4700MQ (indice 30) = 13.600 punti. */
const BENCH_REF=13600;
function cpuBench(ms){
  const arr=new Float64Array(4096); let x=1,n=0; const step=()=>{ for(let i=0;i<4096;i++){ x=(Math.imul(x,1103515245)+12345)|0; arr[i]=Math.sqrt((x>>>8)&0xffff)+arr[(i*7)&4095]*0.5; } };
  let g=0; const w=performance.now(); while(performance.now()-w<150&&g++<60000) step();
  const runs=[]; for(let r=0;r<3;r++){ n=0; const t0=performance.now(); while(performance.now()-t0<ms&&n<200000) { step(); n++; } const dt=performance.now()-t0; if(dt>0) runs.push(n/dt*1000); }
  if(!runs.length) return null;
  return {pts:Math.round(Math.max(...runs)), chk:arr[5]};
}
const threadAdj=t=>!t?1:t>=12?1.04:t>=8?1:t>=6?0.95:t>=4?0.85:0.65;
const benchToIdx=(pts,threads)=>clamp(Math.round(30*Math.pow(pts/BENCH_REF,1.3)*threadAdj(threads)),5,100);
const idxToBench=idx=>Math.round(BENCH_REF*Math.pow(idx/30,1/1.3));

  try{ const e=await navigator.storage?.estimate?.(); if(e&&e.quota>20e9&&/Chrome|Edg/.test(navigator.userAgent)) p.diskEstGB=Math.round(e.quota/0.6/1e9); }catch(e){}
  try{
    const c=document.createElement("canvas");
    const gl=c.getContext("webgl",{powerPreference:"high-performance"})||c.getContext("experimental-webgl");
    if(gl){ const ext=gl.getExtension("WEBGL_debug_renderer_info"); const r=ext?gl.getParameter(ext.UNMASKED_RENDERER_WEBGL):gl.getParameter(gl.RENDERER); const name=parseRenderer(r); if(name) p.gpus.push({name,raw:r}); }

  try{

async function decodeScan(txt){
  let t=String(txt||"").trim().replace(/\s+/g,"");
  try{ t=decodeURIComponent(t); }catch(_){}
  const m=t.match(/PCSCAN([12])[:-]([A-Za-z0-9+/=_-]+)/); if(!m) throw new Error("Il testo incollato non contiene un codice RigScore. Deve iniziare con PCSCAN.");
  let b=m[2].replace(/-/g,"+").replace(/_/g,"/"); while(b.length%4) b+="=";
  const bin=atob(b); let bytes=new Uint8Array(bin.length); for(let k=0;k<bin.length;k++) bytes[k]=bin.charCodeAt(k);
  if(m[1]==="2"){
    if(typeof DecompressionStream==="undefined") throw new Error("Questo browser non sa decomprimere il codice: usa Chrome, Edge o Firefox aggiornati.");
    const ds=new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
    bytes=new Uint8Array(await new Response(ds).arrayBuffer());
  }
  const j=JSON.parse(new TextDecoder("utf-8").decode(bytes));
  const ch=(j.sys&&j.sys.chassis)||[];
  let type="unknown";
  if(ch.some(c=>LAPTOP_CH.includes(c))||j.sys?.pcType===2) type="laptop";
  else if(ch.some(c=>AIO_CH.includes(c))) type="aio";
  else if(ch.some(c=>MINI_CH.includes(c))) type="mini";
  else if(ch.some(c=>DESK_CH.includes(c))||j.sys?.pcType===1) type="desktop";
  if(type==="unknown") type=j.sys?.battery?"laptop":"desktop";
  const ram=j.ram||{}; if(ram.sumGB) ram.totalGB=ram.sumGB;
  const disp=(j.gpu||[]).find(g=>g.w)||null;
  if(disp&&j.mon?.length){ const mo=j.mon.find(x=>x.n)||j.mon[0]; disp.mon=[mo.mf,mo.n].filter(Boolean).join(" "); }
  return {source:"scan",t:j.t,type,sys:j.sys||{},os:j.os||{},cpu:j.cpu||{},gpus:j.gpu||[],ram,disks:j.disks||[],vols:j.vols||[],sw:j.sw||{},display:disp};
}

    const iot=/iot/i.test(name);
    if(b===17763) return res(iot?"2029-01-09":"2029-01-09","LTSC 2019");
    if(b===19044) return res(iot?"2032-01-13":"2027-01-12",iot?"IoT LTSC 2021":"LTSC 2021");
    if(b>=26100) return res(iot?"2034-01-10":"2029-10-09",iot?"IoT LTSC 2024":"LTSC 2024");
    return res("2026-10-13","LTSB");
  }
  if(b && b<22000) return {...res("2025-10-14","Windows 10"),esu:true};
  if(b===22000) return res("2023-10-10","Windows 11 21H2");
  if(b===22621||b===22631) return res("2025-11-11","Windows 11 "+(b===22631?"23H2":"22H2"));
  if(b===26100) return res(/enterprise|education/i.test(name)?"2027-10-12":"2026-10-13","Windows 11 24H2");
  if(b>=26200) return res(/enterprise|education/i.test(name)?"2028-10-10":"2027-10-12","Windows 11 "+(os.disp||"25H2"));
  return {unknown:true,label:name||"Sconosciuto"};
}
function ramType(st){ if(!st) return null; if(RAMTYPE[st.type]) return RAMTYPE[st.type]; const sp=st.speed||0; return sp>=4400?"DDR5":sp>=2133?"DDR4":sp>0?"DDR3":null; }

function analyze(p){
  const o=OV;
  let type=o.type&&o.type!=="auto"?o.type:p.type;
  const isLap=type==="laptop";
  // CPU
  const cpuName=o.cpu||p.cpu?.name||"";
  const ci=cpuInfo(cpuName);
  let cpuS=ci.s;
  const threads=p.cpu?.threads||null, cores=p.cpu?.cores||null;

  if(cpuS==null && bench){ cpuS=bench.idx; cpuFromBench=true; }
  else if(cpuS==null && threads) cpuS=clamp(threads*4,12,55);
  if(cpuS!=null && threads && threads<4 && !cpuFromBench) cpuS*=0.75;
  if(!isLap && ci.mobile && type==="unknown") type="laptop";
  // GPU
  let gpus=(p.gpus||[]).map(g=>({...g,...gpuInfo(g.name,isLap||ci.mobile,cpuName)}));
  if(o.gpu){ gpus=[{name:o.gpu,manual:true,...gpuInfo(o.gpu,isLap,cpuName)}].concat(gpus.filter(g=>g.name!==o.gpu)); }
  gpus.sort((a,b)=>(b.s||0)-(a.s||0));
  const gpu=gpus[0]||{name:"Non rilevata",s:null,known:false};
  if(gpu.vramMB && gpu.kind!=="i") gpu.vramGB=Math.round(gpu.vramMB/1024); else gpu.vramGB=gpu.vram||0;
  const gpuS=gpu.s;
  // RAM
  const sticks=p.ram?.sticks||[];
  let ramGB=o.ram?+o.ram:(p.ram?.totalGB||null);
  if(ramGB) ramGB=Math.round(ramGB);
  const rtype=o.ramType||ramType(sticks[0]);
  const ramSpeed=sticks[0]?.cfg||sticks[0]?.speed||null;
  const ramRated=sticks[0]?.speed||null;
  const soldered=sticks.some(s=>/LPDDR/.test(RAMTYPE[s.type]||""))||(isLap&&sticks.length>0&&sticks.every(s=>s.ff&&s.ff!==12&&s.ff!==8&&s.ff!==0));
  const dual=sticks.length>=2;
  // Archiviazione
  const disks=p.disks||[];
  const sysDisk=disks.find(d=>(d.letters||[]).includes("C"))||disks[0]||null;
  let sysType=o.disk||(sysDisk?(sysDisk.media==="HDD"?"HDD":sysDisk.bus==="NVMe"?"NVMe":sysDisk.media==="SSD"?"SSD":sysDisk.bus==="NVMe"?"NVMe":"?"):null);

  const os=o.os?{name:o.os,build:o.os==="Windows 11"?26200:19045}:(p.os||{});
  // Punteggi 0-100
  const gpuN=gpuS!=null?clamp(Math.round(Math.sqrt(gpuS/36000)*100),1,100):null;
  const cpuN=cpuS!=null?Math.round(cpuS):null;
  let ramN=ramGB?(ramGB>=32?100:ramGB>=16?78:ramGB>=12?58:ramGB>=8?40:18):null;
  if(ramN&&sticks.length===1&&!soldered) ramN-=10;
  if(ramN&&rtype==="DDR3") ramN-=8;
  const stoN=sysType==="NVMe"?100:sysType==="SSD"?78:sysType==="HDD"?25:null;
  const parts=[[gpuN,.55],[cpuN,.28],[ramN,.11],[stoN,.06]].filter(x=>x[0]!=null);
  const wsum=parts.reduce((a,x)=>a+x[1],0);
  const total=wsum?Math.round(parts.reduce((a,x)=>a+x[0]*x[1],0)/wsum):null;
  const tier=total==null?"—":total>=80?"Fascia alta":total>=60?"Fascia medio-alta":total>=42?"Fascia media":total>=25?"Fascia base":"Fascia minima";
  let bottleneck=null;
  if(gpuN!=null&&cpuN!=null){
    if(cpuN<gpuN*0.75-5) bottleneck={what:"cpu",text:`Il processore frena la scheda video: nei giochi la GPU non viene sfruttata del tutto (CPU ${cpuN} contro GPU ${gpuN}).`};

}

const RES=[{l:"1080p",f:1},{l:"1440p",f:0.6},{l:"4K",f:0.3}];
function evalGame(g,a,res,hyp){
  const gpuS=(hyp?hyp.g:a.gpuS), cpuS=(hyp?hyp.c:a.cpu.s), ram=(hyp?32:a.ram.gb), rt=hyp?true:a.gpu.rt;
  if(gpuS==null||cpuS==null) return {pct:null};
  const rf=RES[res].f;
  const rg=gpuS*rf/g.gRec, rc=Math.pow(cpuS/g.cRec,1.2);
  const p=Math.min(rg,rc);
  const atMin=clamp(g.gMin/g.gRec,0.08,0.9);
  let pct = p<=atMin ? 40*p/atMin : p<=1 ? 40+30*(p-atMin)/(1-atMin) : 70+30*Math.min(1,(p-1)/1.2);
  const why=[];
  let limit=rg<rc?"GPU":"CPU";
  if(cpuS<g.cMin*0.85){ pct=Math.min(pct,36); why.push("CPU sotto il minimo"); limit="CPU"; }
  if(ram&&ram<g.rmin-0.6){ pct=Math.min(pct,32); why.push(`servono ${g.rmin} GB di RAM`); limit="RAM"; }
  if(!hyp&&g.vram&&a.gpu.kind!=="i"&&a.gpu.vramGB&&a.gpu.vramGB<g.vram*0.75){ pct-=8; why.push(`VRAM ${a.gpu.vramGB} GB (consigliati ${g.vram})`); }
  if(g.rt&&!rt){ pct=0; why.push("richiede una GPU con ray tracing"); limit="GPU"; }
  let blocked=false;
  if(!hyp&&g.sb&&a.secureBoot===false){ blocked=true; why.push("Secure Boot disattivato"); }
  if(!hyp&&g.ssd&&a.sysType==="HDD") why.push("consigliato SSD");
  pct=clamp(Math.round(pct),0,100);
  const gp=g.fps*Math.pow(rg,0.95), cp=g.fps*1.5*rc;
  const preset=pct>=90?"Ultra":pct>=75?"Alto":pct>=55?"Medio":pct>=38?"Basso":"—";
  const fps=Math.min(gp*(pct>=75?1:pct>=55?1.25:1.7), cp*(pct>=55?1:1.07));
  const verdict=g.rt&&!rt?["bad","Incompatibile"]:pct>=90?["good","Ultra"]:pct>=75?["good","Fluido"]:pct>=55?["info","Medio"]:pct>=38?["warn","Al minimo"]:["bad","Non gira"];
  return {pct,fps:Math.round(fps),preset,verdict,why,limit,blocked,playable:pct>=38};
}

function renderOver(){

  const playable=ge.filter(x=>x.playable).length, fluid=ge.filter(x=>x.pct>=75).length;

  const bt=a.bench?`benchmark ${a.bench.pts.toLocaleString(LOC())} punti${a.bench.ratio?` (${Math.round(a.bench.ratio*100)}% dell'atteso)`:""}`:"";

  const g2=a.gpus.slice(1).map(g=>g.name).join(", ");

  const cpuOffers=[]; const plat=a.cpu.info.plat; const pd=plat?CPU_BUY[plat]:null;
  if(!limited&&pd){
    pd.cpus.forEach(o=>{ const ns=cpuRef(o.c); if(ns<cpuS+6) return; const newCap=capFor(ns); const gain=(Math.min(gpuS,newCap)/Math.min(gpuS,cap)-1)*100; cpuOffers.push({n:o.n,p:o.p,q:o.c,used:/usat/.test(o.n),gain:Math.max(gain,(ns/cpuS-1)*40),games:gamesUnlocked(a,gpuS,ns),kv:[["Socket",plat],["Indice CPU",`${Math.round(cpuS)} → ${ns}`]]}); });
  }
  // Piattaforma
  const bundles=[];
  if(!limited&&s.cpuN<60){
    BUNDLES.forEach(b=>{ if(b.ddr4&&a.ram.type!=="DDR4") return; if(b.ddr4&&(a.ram.gb||0)<16) return; const ns=cpuRef(b.c); const newCap=capFor(ns); const gain=Math.max((Math.min(gpuS,newCap)/Math.min(gpuS,cap)-1)*100,(ns/cpuS-1)*40); bundles.push({...b,gain,games:gamesUnlocked(a,gpuS,ns),q:b.c,kv:[["Indice CPU",`${Math.round(cpuS)} → ${ns}`]]}); });
  }
  // Nuovi PC
  const news=(limited?LAPTOPS.concat(BUILDS):BUILDS).map(b=>{ const gs=gpuInfo(b.g,false).s, cs=cpuRef(b.c); const gain=(Math.min(gs,capFor(cs))/Math.min(gpuS,cap)-1)*100; return {...b,gain,games:gamesUnlocked(a,gs,cs),q:b.parts.split(" · ")[1]||b.n,kv:[["GPU",b.g],["CPU",b.c]]}; });

  // Verdetto
  let v;
  const old=s.cpuN<35&&s.gpuN<25;
  if(limited&&old) v=`<b>Conviene un PC nuovo.</b> Su un ${TYPE_L[a.type].toLowerCase()} processore e scheda video non si cambiano, e i tuoi sono ormai datati (indice CPU ${s.cpuN}, GPU ${s.gpuN}). ${ram.filter(r=>!r.info).length||a.sysType==="HDD"?"RAM e SSD lo rendono più reattivo per l'uso quotidiano, ma non cambiano molto nei giochi.":"Hai già il massimo di RAM e un SSD: gli unici interventi utili sono pulizia e pasta termica."} Per giocare, un PC fisso da circa 950 € offre molte più prestazioni per euro di un portatile.`;
  else if(limited) v=`<b>Puoi migliorare solo RAM, archiviazione e raffreddamento.</b> Su un ${TYPE_L[a.type].toLowerCase()} CPU e GPU sono saldate. Gli interventi qui sotto allungano la vita al PC; quando non basterà più, guarda i confronti con un PC nuovo.`;
  else if(a.sysType==="HDD") v=`<b>Prima di tutto un SSD.</b> È l'upgrade più economico e quello che si sente di più. Poi ${a.bottleneck?.what==="cpu"?"la piattaforma (CPU, scheda madre e RAM)":"la scheda video"}.`;
  else if(s.cpuN<40) v=`<b>Cambia piattaforma prima della scheda video.</b> Con questo processore (indice ${s.cpuN}) una GPU nuova renderebbe meno della metà. Con CPU, scheda madre e RAM nuove puoi poi montare una GPU moderna; il resto (alimentatore, case, dischi) spesso si recupera.`;
  else if(a.bottleneck?.what==="cpu") v=`<b>Prima il processore.</b> ${pd&&cpuOffers.length?"Il socket della tua scheda madre accetta CPU più veloci: è il modo più economico per sbloccare la GPU.":"Il socket non offre CPU molto più veloci: serve una piattaforma nuova."}`;
  else v=`<b>Il primo upgrade è la scheda video.</b> Il processore regge${s.cpuN>=70?" anche GPU di fascia alta":" GPU fino a circa "+(cap>=20000?"fascia alta":cap>=10000?"fascia media":"fascia medio-bassa")}. Controlla che l'alimentatore abbia la potenza indicata e i connettori PCIe giusti.`;

  const blk=(t,sub,arr)=>arr.length?`<div class="stack"><div><h3>${t}</h3>${sub?`<p class="small muted">${sub}</p>`:""}</div><div class="offers">${arr.map(o=>o.info?`<div class="offer"><h3>${esc(o.n)}</h3><p class="small">${esc(o.note)}</p></div>`:offerCard(o)).join("")}</div></div>`:"";
  const brd=p.sys?.board||"";
  const chipset=(brd.toUpperCase().match(/\b([ABHXZQ]\d{3}[EM]?)\b/)||[])[1];
  const prebuilt=/^(hp|hewlett|dell|lenovo|acer|asus|medion|fujitsu)/i.test(p.sys?.maker||"")&&!limited;
  $("#p-upg").innerHTML=`<div class="sec-head"><div class="stack" style="gap:6px"><h2>Upgrade hardware</h2><p class="muted small">${PRICE_NOTE}</p></div></div>
  <div class="panel stack"><div class="verdict"><p>${v}</p></div>
   <dl class="kv"><dt>Tipo</dt><dd>${TYPE_L[a.type]}</dd>${brd?`<dt>Scheda madre</dt><dd>${esc(brd)}${chipset?" (chipset "+chipset+")":""}</dd>`:""}${pd?`<dt>Piattaforma</dt><dd>${esc(pd.label)} · RAM ${pd.ram}</dd>`:""}<dt>Limite CPU per la GPU</dt><dd>${limited?"—":"fino a indice "+Math.round(cap).toLocaleString(LOC())+" (circa "+(GPUS.filter(g=>g.kind==="d").sort((x,y)=>Math.abs(x.s-cap)-Math.abs(y.s-cap))[0].n)+")"}</dd></dl>
   ${pd?.note?`<p class="note">${esc(pd.note)}</p>`:""}${prebuilt?`<p class="note">PC di marca (${esc(p.sys.maker)}): spesso hanno alimentatore poco potente con connettori proprietari e case piccoli. Prima di comprare una GPU controlla la potenza sull'etichetta dell'alimentatore e lo spazio disponibile.</p>`:""}</div>
  ${blk("Archiviazione",limited?"Sui portatili verifica prima che slot c'è (M.2 2280, 2242, 2230 o vano 2,5\") nel manuale di servizio.":"",sto2)}
  ${blk("Memoria RAM","",ram)}
  ${blk("Scheda video","Ordinate per prezzo. Il guadagno tiene conto di quanto il tuo processore riesce a sfruttarle.",gpuOffers)}
  ${blk("Processore compatibile con la tua scheda madre",pd?`Socket ${plat}: nessun cambio di scheda madre o RAM.`:"",cpuOffers)}
  ${blk("Nuova piattaforma (CPU + scheda madre + RAM)","Tieni scheda video, alimentatore, case e dischi. Aggiungi circa 30–40 € per un dissipatore se il tuo non è compatibile.",bundles)}
  ${blk(limited?"Se cambi PC":"PC completo nuovo, per confronto",limited?"Un fisso costa meno a parità di prestazioni; un portatile serve se ti sposti spesso. Prezzi senza monitor.":"Prezzi senza monitor, tastiera e mouse.",news)}
  ${limited?`<div class="panel stack"><h3>Accessori utili per il portatile</h3><ul><li><b>Base di raffreddamento</b> (20–35 €): abbassa le temperature di 3–8 °C.</li><li><b>Pulizia e pasta termica</b> (10 € fai-da-te, 40–60 € in assistenza).</li><li><b>Cavo Ethernet o adattatore USB-LAN</b> (10–15 €) per giocare online.</li><li><b>eGPU</b>: solo se il portatile ha Thunderbolt 3/4 o USB4; box e GPU partono da circa 400 €, quindi conviene solo su portatili recenti.</li></ul></div>`:""}`;
}

/* ============ RENDER: SCANSIONE ============ */
const CPU_LIST=["Intel Core i3-10100F","Intel Core i5-4460","Intel Core i5-6500","Intel Core i5-7400","Intel Core i5-8400","Intel Core i5-9400F","Intel Core i5-10400F","Intel Core i5-11400F","Intel Core i5-12400F","Intel Core i5-13400F","Intel Core i5-14600KF","Intel Core i7-4790","Intel Core i7-6700K","Intel Core i7-8700K","Intel Core i7-9700K","Intel Core i7-10700K","Intel Core i7-12700K","Intel Core i7-13700K","Intel Core i7-14700K","Intel Core i9-12900K","Intel Core i9-13900K","Intel Core i9-14900K","Intel Core Ultra 5 245K","Intel Core Ultra 7 265K","Intel Core Ultra 9 285K","Intel Core i5-1135G7","Intel Core i5-1235U","Intel Core i7-1165G7","Intel Core i7-12700H","Intel Core i7-13700H","Intel Core i7-14700HX","Intel Core Ultra 7 155H","Intel Core Ultra 7 258V","AMD Ryzen 5 1600","AMD Ryzen 5 2600","AMD Ryzen 5 3600","AMD Ryzen 5 5600","AMD Ryzen 5 5600X","AMD Ryzen 7 5700X3D","AMD Ryzen 7 5800X3D","AMD Ryzen 5 7600","AMD Ryzen 7 7800X3D","AMD Ryzen 5 9600X","AMD Ryzen 7 9800X3D","AMD Ryzen 9 7950X","AMD Ryzen 5 5500U","AMD Ryzen 7 5800H","AMD Ryzen 7 6800H","AMD Ryzen 7 7840HS","AMD Ryzen 7 8845HS","AMD Ryzen AI 9 HX 370","AMD Ryzen Z1 Extreme","AMD Ryzen 7 260","AMD Ryzen 7 8700G","AMD Ryzen 9 9950X3D","AMD Ryzen 7 5700G","AMD Athlon 3000G","AMD FX-8350","Intel Core i7-920","Intel Core i7-2600K","Intel Core i7-3770K","Intel Xeon E3-1230 v3","Intel Xeon E5-2680 v4","Intel Pentium Gold G6400","Intel Celeron N4020","Intel N100","Intel Core 5 120U","Intel Core Ultra 9 285K","Intel Core i9-14900HX","Snapdragon X Elite X1E-78-100","AMD Custom APU 0405 (Steam Deck)"];
function renderScan(){
  const ps=$("#ps-src").textContent.trim();
  const a=A;
  $("#p-scan").innerHTML=`<div class="sec-head"><div class="stack" style="gap:6px"><h2>Scansione</h2><p class="muted small">Per sicurezza nessun sito può leggere modello della CPU, tipo e velocità della RAM, dischi e scheda madre. Lo fa un piccolo script PowerShell che <b>legge soltanto</b>: non installa e non modifica niente. Alla fine apre RigScore con i risultati nel link: i dati vengono elaborati solo nel tuo browser e non vengono inviati a nessun server.</p></div></div>
  <div class="panel stack"><h3>Cosa ho rilevato finora</h3><dl class="kv">
   <dt>Fonte</dt><dd>${a.p.source==="scan"?"scansione completa del "+new Date(a.p.t).toLocaleString(LOC(),{dateStyle:"short",timeStyle:"short"}):"browser (scansione rapida)"}</dd>
   <dt>Processore</dt><dd>${esc(a.cpu.name||(a.bench?"modello sconosciuto, benchmark "+a.bench.pts.toLocaleString(LOC())+" pt":"—"))}</dd>
   <dt>Scheda video</dt><dd>${esc(a.gpu.name)}</dd>
   <dt>RAM</dt><dd>${a.ram.gb?(a.ram.approx?"≈ ":"")+a.ram.gb+" GB"+(a.ram.type?" "+a.ram.type:""):"—"}</dd>
   <dt>Disco</dt><dd>${a.sysType?a.sysType:(a.p.diskEstGB?"≈ "+a.p.diskEstGB+" GB, tipo sconosciuto":"—")}</dd>
   <dt>Tipo di PC</dt><dd>${TYPE_L[a.type]}</dd></dl></div>
  <div class="panel stack" style="border-color:var(--accent)">
   <div><h3>Scansione con un clic</h3><p class="small muted">Per sicurezza una pagina web non può aprire PowerShell da sola. Il pulsante usa un link <span class="mono">rigscore://</span> registrato sul tuo PC, come fanno i link <span class="mono">steam://</span> o <span class="mono">discord://</span>.</p></div>
   <div class="steps">
    <div class="step"><span class="num">OGNI VOLTA</span><h3>Avvia la scansione</h3><a class="btn primary" id="runScan" href="rigscore://scan" target="_blank" rel="noopener" style="align-self:start;text-decoration:none">Avvia scansione</a><p class="note">Il browser chiede “Aprire RigScore?”: conferma (e spunta “Consenti sempre”). PowerShell legge le specifiche e apre RigScore con i risultati. Puoi anche usare l'icona <b>RigScore</b> sul Desktop.</p></div>
    <div class="step"><span class="num">SOLO LA PRIMA VOLTA</span><h3>Installa il pulsante</h3>${cmdBlock(INST_CMD)}<p class="note">Incolla questa riga in PowerShell (<kbd>Win</kbd>+<kbd>X</kbd> › Windows PowerShell) e premi <kbd>Invio</kbd>. Non servono permessi di amministratore: salva lo script in <span class="mono">%LOCALAPPDATA%\\you_are_incredible\\RigScore</span>, registra il link, crea l'icona sul Desktop e fa subito la prima scansione.</p><details><summary class="small">Per rimuoverlo</summary>${cmdBlock("Remove-Item 'HKCU:\\Software\\Classes\\rigscore' -Recurse; Remove-Item \"$env:LOCALAPPDATA\\you_are_incredible\\RigScore\" -Recurse; Remove-Item \"$([Environment]::GetFolderPath('Desktop'))\\RigScore.lnk\"")}</details></div>
   </div>
  </div>
  <div class="panel stack">
   <div class="steps">
    <div class="step" style="grid-column:1/-1"><h3>Senza installare niente</h3><p class="small muted">Una riga in PowerShell: legge le specifiche e apre RigScore con i risultati.</p></div>
    <div class="step"><span class="num">PASSO 1</span><h3>Copia il comando</h3>${cmdBlock(SCAN_CMD)}<p class="note">Scarica ed esegue lo script dal sito di RigScore. Puoi leggerlo prima: <a href="${SITE}scan.ps1" target="_blank" rel="noopener">scan.ps1</a>.</p></div>
    <div class="step"><span class="num">PASSO 2</span><h3>Incollalo in PowerShell</h3><p class="small">Premi <kbd>Win</kbd>+<kbd>X</kbd> e scegli <b>Windows PowerShell</b> o <b>Terminale</b>. Incolla con clic destro o <kbd>Ctrl</kbd>+<kbd>V</kbd> e premi <kbd>Invio</kbd>. Dopo 10–30 secondi si apre RigScore con i risultati.</p><p class="note">Aprendo PowerShell “come amministratore” leggo anche TPM, usura dei dischi e salute della batteria.</p></div>
    <div class="step"><span class="num">SE NON SI APRE</span><h3>Premi Ctrl+V su questa pagina</h3><p class="note">Il risultato è anche negli appunti: premi <kbd>Ctrl</kbd>+<kbd>V</kbd> in un punto qualsiasi, oppure incollalo qui sotto.</p><textarea id="scanIn" rows="3" placeholder="PCSCAN1:eyJ2Ijox…"></textarea><div class="row"><button class="btn primary" id="scanGo">Analizza</button><span class="small" id="scanMsg" role="status"></span></div></div>
   </div>
   <details><summary class="small">Mostra lo script (${ps.split("\n").length} righe, solo lettura)</summary><textarea id="psText" rows="12" readonly style="margin-top:8px">${esc(ps)}</textarea></details>
  </div>
  <div class="panel stack">
   <div><h3>Correggi o completa a mano</h3><p class="small muted">Utile dopo la scansione rapida o se un componente non viene riconosciuto. I campi vuoti usano il valore rilevato.</p></div>
   <div class="form">
    <label class="f">Tipo di PC<select id="ovType"><option value="auto">Automatico (${TYPE_L[a.p.type]||"?"})</option><option value="desktop">PC fisso</option><option value="laptop">Portatile</option><option value="aio">All-in-one</option><option value="mini">Mini PC</option></select></label>
    <label class="f">Processore<input type="text" id="ovCpu" list="dlCpu" placeholder="${esc(a.p.cpu?.name||"es. Intel Core i5-12400F")}"></label>
    <label class="f">Scheda video<input type="text" id="ovGpu" list="dlGpu" placeholder="${esc(a.p.gpus?.[0]?.name||"es. RTX 3060")}"></label>
    <label class="f">RAM (GB)<input type="number" id="ovRam" min="1" max="512" placeholder="${a.ram.gb||"16"}"></label>
    <label class="f">Disco di sistema<select id="ovDisk"><option value="">Automatico${a.sysType&&!OV.disk?" ("+a.sysType+")":""}</option><option value="NVMe">SSD NVMe</option><option value="SSD">SSD SATA</option><option value="HDD">Hard disk</option></select></label>
    <label class="f">Windows<select id="ovOs"><option value="">Automatico</option><option value="Windows 11">Windows 11 aggiornato</option><option value="Windows 10">Windows 10 (Home/Pro)</option></select></label>
   </div>
   <datalist id="dlCpu">${CPU_LIST.map(c=>`<option value="${c}">`).join("")}</datalist>
   <datalist id="dlGpu">${GPUS.slice().sort((x,y)=>y.s-x.s).map(g=>`<option value="${g.n}">`).join("")}</datalist>
   <div class="row"><button class="btn primary" id="ovApply">Applica</button><button class="btn" id="ovReset">Togli correzioni</button><button class="btn" id="rescan">Rifai la scansione rapida</button></div>
   ${a.p.source==="browser"&&a.p.evidence?.length?`<p class="note">Indizi raccolti dal browser: ${esc(a.p.evidence.join(", "))}.</p>`:""}
   ${a.p.source==="browser"&&a.p.gpus?.[0]?.raw?`<p class="note mono">WebGL: ${esc(a.p.gpus[0].raw)}</p>`:""}
  </div>
  
  <p class="note">I dati restano in questo browser (memoria locale della pagina). Lo script è leggibile qui sopra: legge informazioni di sistema tramite WMI e registro e usa Set-Clipboard per copiare il risultato.</p>`;
  $("#ovType").value=OV.type||"auto"; $("#ovCpu").value=OV.cpu||""; $("#ovGpu").value=OV.gpu||""; $("#ovRam").value=OV.ram||""; $("#ovDisk").value=OV.disk||""; $("#ovOs").value=OV.os||"";
}

/* ============ CONTROLLO ============ */
const SITE="https://ridiconclaudio.github.io/rigscore/";
const SCAN_CMD=`irm ${SITE}scan.ps1 | iex`;
const INST_CMD=`irm ${SITE}install.ps1 | iex`;
function recompute(){ A=analyze(P); renderOver(); renderGames(); renderSoft(); renderUpg(); renderScan(); $("#srcLabel").textContent=P.source==="scan"?"scansione completa":"scansione rapida"; }
function setTab(t){ UI.tab=t; document.querySelectorAll('[role="tab"]').forEach(b=>b.setAttribute("aria-selected",b.id==="t-"+t)); document.querySelectorAll('[role="tabpanel"]').forEach(s=>s.hidden=s.id!=="p-"+t); store.set("rigscore.tab",t); window.scrollTo({top:0}); }
document.addEventListener("click",async e=>{
  const t=e.target.closest("button,[data-go]"); if(!t) return;
  if(t.getAttribute("role")==="tab") return setTab(t.id.slice(2));
  if(t.dataset.go) return setTab(t.dataset.go);
  if(t.dataset.copy!==undefined){ const ok=await copyText(t.dataset.copy); toast(ok?"Comando copiato":"Copia non riuscita: seleziona il testo a mano"); return; }
  if(t.dataset.res!==undefined){ UI.res=+t.dataset.res; renderGames(); return; }
  if(t.dataset.only){ UI.only=t.dataset.only; renderGames(); return; }
  if(t.id==="scanGo"){ const msg=$("#scanMsg"); try{ await importText($("#scanIn").value); }catch(err){ msg.textContent=trS(err.message.startsWith("Il testo")?err.message:"Codice incompleto o danneggiato: ricopialo dal PowerShell per intero."); msg.style.color="var(--bad)"; } return; }
  if(t.id==="ovApply"){ OV={type:$("#ovType").value,cpu:$("#ovCpu").value.trim(),gpu:$("#ovGpu").value.trim(),ram:$("#ovRam").value,disk:$("#ovDisk").value,os:$("#ovOs").value}; Object.keys(OV).forEach(k=>{if(!OV[k]||OV[k]==="auto") delete OV[k]}); store.set("rigscore.ov",OV); recompute(); toast("Correzioni applicate"); return; }
  if(t.id==="ovReset"){ OV={}; store.del("rigscore.ov"); recompute(); toast("Correzioni rimosse"); return; }
  if(t.id==="rescan"){ store.del("rigscore.profile"); toast("Benchmark in corso…"); await new Promise(r=>setTimeout(r,50)); BENCH=cpuBench(300); P=await browserScan(); recompute(); toast("Scansione rapida aggiornata"); return; }
});
document.addEventListener("input",e=>{ if(e.target.id==="gq"){ UI.q=e.target.value; const pos=e.target.selectionStart; renderGames(); const el=$("#gq"); el.focus(); try{el.setSelectionRange(pos,pos)}catch(_){} } });
document.addEventListener("change",e=>{ if(e.target.id==="gsort"){ UI.sort=e.target.value; renderGames(); } });
let HASHINFO="nessuna";
async function importHash(){
  const h=location.hash||""; HASHINFO=h?h.length+" caratteri":"nessuna";
  if(!/PCSCAN/.test(h)) return false;
  try{ P=await decodeScan(h.slice(1)); store.set("rigscore.profile",P); try{ history.replaceState(null,"",location.pathname+location.search); }catch(_){} return true; }
  catch(e){ return false; }
}
async function importText(txt){ P=await decodeScan(txt); store.set("rigscore.profile",P); recompute(); setTab("over"); const w=$("#waitBar"); if(w) w.hidden=true; toast("Scansione completa caricata"); }
document.addEventListener("paste",async e=>{
  const txt=(e.clipboardData||window.clipboardData)?.getData("text")||"";
  if(!/PCSCAN/.test(txt)) return;
  e.preventDefault();
  try{ await importText(txt); }catch(err){ toast("Codice incompleto: rifai la scansione"); }
});
document.addEventListener("click",e=>{ if(e.target.closest("#runScan")){ const w=$("#waitBar"); if(w) w.hidden=false; if(window.top===window){ e.preventDefault(); location.href="rigscore://scan"; } } },true);
window.addEventListener("storage",e=>{ if(e.key==="rigscore.profile"&&e.newValue){ try{ P=JSON.parse(e.newValue); recompute(); const w=$("#waitBar"); if(w) w.hidden=true; toast("Scansione completa caricata"); }catch(_){} } });
window.addEventListener("hashchange",async()=>{ if(await importHash()){ recompute(); setTab("over"); toast("Scansione completa caricata"); } });
(async function start(){
  initPrefs();
  const fromLink=await importHash();
  const saved=store.get("rigscore.profile");
  if(!fromLink) P=saved&&saved.source==="scan"?saved:await browserScan();
  recompute();
  const tab=store.get("rigscore.tab"); setTab(fromLink?"over":(tab&&document.getElementById("t-"+tab)?tab:"over"));
  if(fromLink) toast("Scansione completa caricata");
  setTimeout(()=>{ try{ if(document.hidden) return; BENCH=cpuBench(300); recompute(); }catch(e){} },400);
})();
</script>
